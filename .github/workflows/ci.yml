# ecosim CI gate. The numbered steps appear in this order here (across three jobs that run in
# parallel) and run in this order in `just ci` (ecosim/justfile); ecosim/tests/ci.rs checks both.
# Step 0 runs the Blender exporter's pure half in plain CPython; step 2b builds the docs
# warning-free; step 8 is the release half of the cross-profile determinism test; step 9 checks one
# 60000-tick run under `ecosim check --long`; step 10 runs the Capitol world bundle (shot G3).
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always
  # Fixed so the property tests explore the same cases on every CI run (DECISIONS.md, Test hardening).
  PROPTEST_RNG_SEED: "20260918"

defaults:
  run:
    working-directory: ecosim
    shell: bash

jobs:
  # WHICH JOBS RUN, AND WHY THE RELATION IS DIRECTED (shot C1).
  #
  # `scripts/sync-data.sh` copies the simulator's output into `ecoview/public/`, so ecoview's
  # tests and screenshots run against ecosim's data. The affects-relation is therefore one-way,
  # and a filter keyed naively on the changed directory would be wrong:
  #
  #     a change to        must run
  #     ecosim/            ecosim, ecosim-coverage, ecosim-sims, ecosim-bench AND the two ecoview jobs
  #     ecoview/           ecoview, ecoview-film
  #     ecoview-native/    ecoview-native
  #     anything else      everything
  #
  # That last ecosim -> ecoview edge is not decoration. Shots G4b and G4c broke the `ecoview`
  # job from ecosim-only diffs, and a symmetric filter would have let both through. Do not drop
  # it, and when a fourth component appears, work out which way the arrow points before adding
  # a case below.
  #
  # THE FULL RUN IS THE DEFAULT. A push that says nothing runs every job; the narrow run is
  # opted into by putting `[ci-narrow]` in the head commit's message. A worker who forgets the
  # marker gets complete coverage rather than partial coverage. Never invert this, and never
  # declare a shot Done on a narrow run: the push that closes a shot carries no marker and runs
  # them all (overnight/MASTER.md, "GitHub CI"; overnight/shots/C1-ci-scope.md).
  # The count is deliberately not written down here: it was "eight" until shot C2 split the films
  # off `ecoview`, and a number in a comment is a number that goes stale. There are eight job
  # definitions below and `ecosim-sims` is a matrix of three, so a full run reports ten checks.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
        shell: bash
    outputs:
      ecosim: ${{ steps.pick.outputs.ecosim }}
      ecoview: ${{ steps.pick.outputs.ecoview }}
      native: ${{ steps.pick.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The push range is diffed, so the whole history is needed, not the default one commit.
          fetch-depth: 0

      - name: pick the jobs this diff can affect
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Every path out of this script that is not a clean, marked, wholly-understood diff
          # ends here, running everything. Unknown input must cost time, never coverage.
          everything() {
            printf 'ecosim=true\necoview=true\nnative=true\n' >> "$GITHUB_OUTPUT"
            echo "FULL RUN, every job: $1"
            exit 0
          }
          [ "$EVENT" = push ] || everything "the event is $EVENT, not a push"
          # Piping git into grep would make pipefail depend on whether git noticed the early
          # exit, so the message is captured and matched instead.
          msg=$(git log -1 --pretty=%B "$HEAD_SHA")
          case "$msg" in
            *'[ci-narrow]'*) ;;
            *) everything "the head commit message carries no [ci-narrow] marker" ;;
          esac
          git cat-file -e "${BEFORE}^{commit}" 2>/dev/null \
            || everything "there is no usable commit before this push to diff against"
          files=$(git diff --name-only "$BEFORE" "$HEAD_SHA")
          [ -n "$files" ] || everything "the diff against $BEFORE is empty"
          echo "changed files:"
          echo "$files" | sed 's/^/  /'
          sim=false
          view=false
          native=false
          while IFS= read -r f; do
            case "$f" in
              ecosim/*)         sim=true; view=true ;;
              ecoview/*)        view=true ;;
              ecoview-native/*) native=true ;;
              *)                everything "$f is outside the three components" ;;
            esac
          done <<<"$files"
          printf 'ecosim=%s\necoview=%s\nnative=%s\n' "$sim" "$view" "$native" >> "$GITHUB_OUTPUT"
          echo "NARROW RUN: ecosim=$sim ecoview=$view ecoview-native=$native"

  # Since shot 15 the gate is split three ways so it fits 10 minutes on the 256x64 strip
  # (ecosim/DECISIONS.md, shot 15): `ecosim` runs steps 0-3 and 8, `ecosim-coverage` step 4, and
  # `ecosim-sims` steps 5-7, 9 and 10 as a seed matrix (seed 1 also runs the long run, seed 2 the
  # baseline sweep, seed 3 the Capitol run). `just ci` runs the same steps one after another.
  ecosim:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ecosim == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ecosim/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ecosim/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # A cached binary from an older commit would make the cross-profile test compare stale output.
      - name: drop cached binaries
        run: rm -f target/debug/ecosim target/release/ecosim

      # The Blender exporter's pure half (ecosim/tools/blend_export.py): the rasteriser that
      # decides what the committed Capitol bundle holds. No Blender and no third-party package.
      - name: 0 exporter unit tests
        run: python3 -m unittest discover -s tools -t tools

      - name: 1 fmt
        run: cargo fmt --check

      - name: 2 clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: 2b docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

      - name: 3 test (debug)
        run: cargo test

      # The release half of the cross-profile determinism test; `cargo test --release` builds the
      # release binary, and the debug one is step 3's.
      - name: 8 determinism across profiles
        run: ECOSIM_REQUIRE_CROSS=1 cargo test --release --test integration determinism

  ecosim-coverage:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ecosim == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: llvm-tools-preview

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ecosim/target
          key: ${{ runner.os }}-cov-cargo-${{ hashFiles('ecosim/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cov-cargo-

      - name: 4 coverage
        run: cargo llvm-cov --fail-under-lines 85 --ignore-filename-regex 'main\.rs|cli/' --lcov --output-path lcov.info

      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: ecosim/lcov.info

  ecosim-sims:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ecosim == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ecosim/target
          key: ${{ runner.os }}-sims-cargo-${{ hashFiles('ecosim/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-sims-cargo-

      - name: drop cached binaries
        run: rm -f target/release/ecosim

      - name: 5 build release
        run: cargo build --release

      - name: 6 runs and checks
        run: |
          s=${{ matrix.seed }}
          ./target/release/ecosim run --seed "$s" --ticks 20000 --out "ci-runs/s$s" --snapshot-every 100
          ./target/release/ecosim check "ci-runs/s$s"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: series-s${{ matrix.seed }}
          path: ecosim/ci-runs/*/series.csv

      - name: 7 sweep baseline
        if: matrix.seed == 2
        run: ./target/release/ecosim sweep --baseline --seeds 1,2,3 | tee ci-runs/baseline-margins.txt

      - uses: actions/upload-artifact@v4
        if: always() && matrix.seed == 2
        with:
          name: baseline-margins
          path: ecosim/ci-runs/baseline-margins.txt

      - name: 9 long run
        if: matrix.seed == 1
        run: |
          ./target/release/ecosim run --seed 1 --ticks 60000 --out ci-runs/long-s1 --snapshot-every 10000
          ./target/release/ecosim check --long ci-runs/long-s1

      # The Capitol reference run (shot G3): the committed world bundle, animals off and rainfall
      # flat across the site (shot G3a), 20000 ticks.
      # Seed 1 carries the long run and seed 2 the baseline sweep, so this rides on seed 3.
      - name: 10 capitol run
        if: matrix.seed == 3
        run: |
          ./target/release/ecosim run --world worlds/capitol --seed 42 --ticks 20000 --out ci-runs/capitol-s42 --set animals.enabled=false --set climate.rain_gradient=0
          ./target/release/ecosim check ci-runs/capitol-s42 | tee ci-runs/capitol-check.txt

      - uses: actions/upload-artifact@v4
        if: always() && matrix.seed == 3
        with:
          name: capitol-check
          path: ecosim/ci-runs/capitol-check.txt

  # Tick throughput (ecosim/benches/tick.rs, DECISIONS.md shot 15a): 2000 ticks of seed 42 on the
  # 64x64 and 256x64 worlds, failing on a slowdown of more than 20% against benches/baseline.json,
  # whose numbers come from this job's bench-tick.json artifact.
  ecosim-bench:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ecosim == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ecosim/target
          key: ${{ runner.os }}-bench-cargo-${{ hashFiles('ecosim/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-bench-cargo-

      - name: build bench
        run: cargo bench --bench tick --no-run

      - name: bench against baseline
        run: cargo bench --bench tick

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-tick
          path: ecosim/ci-runs/bench-tick.json
          if-no-files-found: error

  # ecoview gate: build the two runs it renders (the seed-42 strip at format 3, and the Capitol world
  # bundle at format 4 for shots 12-15), then build, unit + scenario tests and screenshots.
  # shot:check compares the fresh screenshots with the committed references region by region, and runs
  # on this Linux runner even though the references were rendered on Windows (ecoview/DECISIONS.md, E5).
  #
  # THE TWO FILMS RUN IN `ecoview-film`, NOT HERE (shot C2). They took 8.1 of this job's worst measured
  # 24.9 minutes and assert nothing the steps below assert, so they sit on their own runner instead of
  # on the front of everything else's queue. They are still a gate: that job is not optional and its
  # `film-check.mjs` comparisons are unchanged (.github/DECISIONS.md, shot C2).
  ecoview:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ecoview == 'true'
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ecoview
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Which machine drew the pictures. This job's wall clock swings about 1.65x run to run on an
      # unchanged suite, and shot C2 measured that the swing is the runner rather than any one test,
      # so the next person reading a slow log should not have to do that archaeology again.
      - name: which runner
        run: |
          nproc
          grep -m1 'model name' /proc/cpuinfo || true
          free -g | head -2

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ecosim/target
          key: ${{ runner.os }}-ecoview-cargo-${{ hashFiles('ecosim/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-ecoview-cargo-

      - name: run s42, run the Capitol and sync
        run: |
          cd ../ecosim
          rm -f target/release/ecosim
          cargo build --release
          # The reference world at defaults: the 256x64 strip, format 3 (ecoview/DECISIONS.md, shot 16).
          # `hydro.enabled=false` pins the renderer's data to the pre-water dynamics: with the water
          # tier on, shot G4 makes every run format 4, and the renderer would load the strip's
          # `world/` grid and render it as a bundle world. At rate 0 the run is byte-identical to the
          # data the reference screenshots were rendered from. Shot G8 teaches the renderer the water
          # tier and removes both pins (ecosim/DECISIONS.md, shot G4).
          ./target/release/ecosim run --seed 42 --ticks 20000 --out runs/s42 --snapshot-every 100 --set hydro.enabled=false
          # The Capitol reference run, which shots 12-15 render (ecoview/DECISIONS.md, shot G7).
          # runs/ is gitignored, so the renderer's job regenerates it; every bundle run carries these
          # two overrides. Snapshots every 1000, since the shots only need t=0 and t=20000.
          ./target/release/ecosim run --world worlds/capitol --seed 42 --ticks 20000 --out runs/capitol-s42 --snapshot-every 1000 --set animals.enabled=false --set climate.rain_gradient=0 --set hydro.enabled=false
          cd ..
          bash scripts/sync-data.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ecoview/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: build, unit and scenario tests
        run: npm test

      # Written by tests/e2e/perf.spec.ts during npm test (ecoview/DECISIONS.md, Shot 28).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecoview-perf
          path: ecoview/perf/perf.json
          if-no-files-found: error

      - name: screenshots
        run: npm run shot

      # Since shot E5 this runs on every platform instead of being skipped off Windows: the check gates
      # the #view canvas, which SwiftShader draws identically on both, and only measures the sidebar's
      # platform-dependent text (ecoview/DECISIONS.md, "E5 reference screenshots in CI").
      - name: shot:check
        run: node scripts/shot-ref.mjs check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecoview-shots
          path: |
            ecoview/shots/*.png
            ecoview/shots/diff/*.png
          if-no-files-found: ignore

  # The two s42 films, split off `ecoview` by shot C2 so they run beside it instead of after it.
  # Measured on the slowest of five runs (35587962014): film 2.2 min and tiled film 5.9 min, 8.1 of
  # that job's 24.9 -- a third of a job that was at 83% of its own timeout. Nothing here asserts
  # anything `ecoview` asserts, and nothing there depends on a film, so the two are independent work
  # queued behind one runner for no reason.
  #
  # This is a gate, not a measurement. `film-check.mjs` compares frame 100 of each film with
  # shots/reference/02 cropped to #view (shots E5 and 29), and a red here is a red run. It repeats
  # `ecoview`'s data step verbatim -- the films render the same two runs -- and shares its cargo cache
  # key so the ecosim build stays warm.
  ecoview-film:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ecoview == 'true'
    # 8.1 min of films and about 2 of setup on the slowest runner measured, so this is 2x headroom.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ecoview
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Which machine ran it, as in the `ecoview` job above (shot C2b). This job shares that job's
      # data step and renders through the same SwiftShader, so it draws from the same lottery.
      - name: which runner
        run: |
          nproc
          grep -m1 'model name' /proc/cpuinfo || true
          free -g | head -2

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ecosim/target
          key: ${{ runner.os }}-ecoview-cargo-${{ hashFiles('ecosim/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-ecoview-cargo-

      # Identical to the `ecoview` job's data step; see the comments there for the two --set pins.
      - name: run s42, run the Capitol and sync
        run: |
          cd ../ecosim
          rm -f target/release/ecosim
          cargo build --release
          ./target/release/ecosim run --seed 42 --ticks 20000 --out runs/s42 --snapshot-every 100 --set hydro.enabled=false
          ./target/release/ecosim run --world worlds/capitol --seed 42 --ticks 20000 --out runs/capitol-s42 --snapshot-every 1000 --set animals.enabled=false --set climate.rain_gradient=0 --set hydro.enabled=false
          cd ..
          bash scripts/sync-data.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ecoview/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # The film check compares frame 100 with shots/reference/02, cropped to #view, on every platform (shot E5).
      - name: film
        run: npm run film:check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecoview-film
          path: ecoview/film/s42-material.mp4
          if-no-files-found: error

      # The 2x2 tiled film at scale 1; its material:iso tile is checked against 02 like the single-view film (Shot 29).
      - name: tiled film
        run: npm run film:tiled:check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecoview-film-tiled
          path: ecoview/film/s42-tiled.mp4
          if-no-files-found: error

  # ecoview-native (shot V0): the Bevy spike's CI half. This job is independent -- its only `needs`
  # is `changes`, which decides whether it runs and asserts nothing, so nothing above waits on its
  # work and nothing above can be reddened by it.
  # The mesh golden is the only gate here. It runs with `--no-default-features`, which leaves the
  # engine out entirely: the loader, the voxel world and the mesher are plain Rust, so the gate needs
  # no GPU, no display and about a minute of compile. Everything after it is measurement for
  # MEASUREMENTS.md and carries `continue-on-error: true`.
  ecoview-native:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.native == 'true'
    # The gate itself takes seconds; the budget is for the release build of the viewer (about 8 min
    # even from a warm cache) and the one software-rendered screenshot after it (about 4 min on
    # lavapipe). It was 90 when that step rendered ten pictures instead of one, and the comment that
    # stood here said it should come down with them; shot C1 brought it down. Leave room: a cancelled
    # job is a red run even when every step in it is optional.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ecoview-native
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Which machine ran it, the same three lines as the `ecoview` job above (shot C2b). This job is
      # the second pole behind that one -- 7.9 to 13.8 min over six runs, two tight clusters 1.68x
      # apart -- and the draw is per job, not per run: run 35599849884 got a slow `ecoview` and a fast
      # `ecoview-native` in the same run.
      - name: which runner
        run: |
          nproc
          grep -m1 'model name' /proc/cpuinfo || true
          free -g | head -2

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ecoview-native/target
          key: ${{ runner.os }}-native-cargo-${{ hashFiles('ecoview-native/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-native-cargo-

      # THE GATE: three fixed chunks -- flat, stepped, one building -- hashed against committed values.
      # Timed, because the gate's threshold is "under 60 s on ubuntu-latest".
      - name: mesh golden
        run: |
          start=$SECONDS
          cargo test --release --no-default-features --test mesh_golden
          echo "mesh golden: $((SECONDS - start)) s including compile"

      # Measurement only, never a gate: the software Vulkan stack the screenshot below needs.
      - name: software vulkan
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1 vulkan-tools
          sudo apt-get install -y -qq libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
          ls -l /usr/share/vulkan/icd.d/ || true
          vulkaninfo --summary 2>&1 | head -60 || true

      - name: build the viewer
        continue-on-error: true
        run: cargo build --release

      # This was ten screenshots; shot C1 cut it to one. It is a measurement, never a gate, and it
      # has been made: V0 ran ten on lavapipe and recorded 10/10 at 136-142 s and 811,550 bytes, in
      # `overnight/LOG.md` and not in MEASUREMENTS.md, which this comment cited for it until shot
      # C2b. Ten of them cost 43m 41s of a 52m 46s run, the largest single time sink in this
      # pipeline, and nobody was reading the repetition: the last ten-run pass (b48e7bd) measured
      # 259-267 s and 815,129 bytes every time, which is the runner's CPU rounding the last bit
      # differently and not a change in the picture (`ecoview-native/MEASUREMENTS.md`, "The lavapipe
      # drift, explained"). What is left is a smoke check: the headless software-rendered path still
      # produces a picture off Windows. A screenshot that stops working still shows up here; variance
      # no longer does, and that is the trade (.github/DECISIONS.md, shot C1).
      - name: one headless screenshot on lavapipe (smoke check)
        continue-on-error: true
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
          WGPU_BACKEND: vulkan
        run: |
          start=$SECONDS
          out=shots/ci-1.png
          log=shots/ci-1.log
          if timeout 300 xvfb-run -a ./target/release/ecoview-native --stress --headless --frames 300 --screenshot "$out" > "$log" 2>&1 && [ -s "$out" ]; then
            echo "lavapipe screenshot: ok in $((SECONDS - start)) s, $(stat -c%s "$out") bytes"
          else
            echo "lavapipe screenshot: FAILED after $((SECONDS - start)) s"
            tail -20 "$log" || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ecoview-native-shots
          path: |
            ecoview-native/shots/ci-*.png
            ecoview-native/shots/ci-*.log
          if-no-files-found: ignore
