[package]
name = "ecosim"
version = "0.1.0"
edition = "2021"
description = "POC voxel ecology simulator (SAD 1)"

[lib]
name = "ecosim"
path = "src/lib.rs"

[[bin]]
name = "ecosim"
path = "src/main.rs"

[dependencies]
rand = "=0.8.8"
rand_chacha = "=0.3.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=0.8.23"
clap = { version = "=4.6.7", features = ["derive"] }
libm = "0.2.16"

[profile.release]
debug = false

# The debug profile keeps debug assertions and overflow checks but optimizes a little, so the
# 20000-tick integration tests fit the debug test budget (DECISIONS.md, Test hardening).
[profile.dev]
opt-level = 1

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
sha2 = "=0.11.0"

# cargo-llvm-cov builds with `--cfg coverage`; the tests use it to trim their cost (DECISIONS.md, Test hardening).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
