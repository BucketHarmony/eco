# ecosim parameters. Starting values from docs/SAD-addendum.md; every change is logged in TUNING.md.
# Curves are [min, low-opt, high-opt, max]: 0 at/below min and at/above max, 1 between the opts.

[world]
height_min = 8
height_max = 24
water_level = 10
rock_top_height = 21
soil_depth = 3
water_fraction = 0.04
# Canopy light (shot G4c): Beer-Lambert extinction, I/I0 = exp(-k x LAI) per canopy voxel. A mature
# crown is two voxels deep, so its LAI is 2 x canopy_lai = 4 and it passes exp(-2) = 13.5% of full
# sun, inside the published 10-25% for a broadleaf canopy at LAI 3-5 (UNITS.md R10). The light field
# holds 255 x that fraction, so every light curve below is a fraction of full sun.
canopy_k = 0.5
canopy_lai = 2.0
compact_every = 100
# World size (shot 15): the reference world is a 256×64×32 west–east strip of 32×8 patches.
# A file without these keys means 64×64×32, patch 8. Width and depth are multiples of patch, ≤ 256.
width = 256
depth = 64
height = 32
patch = 8
# Terrain tilt: heights gain slope_bias × (1 − 2x/(width − 1)) before clamping (higher, drier west).
slope_bias = 4.0

[climate]
year_len = 4000
temp_base = 12.0
canopy_cool = 3.0
rain_base = 8.0
rain_amp = 4.0
evap_base = 2.0
evap_div = 8.0
pond_moisture = 255.0
diffusion = 0.10
# Detritus decay, per year. 0.45 is the middle of a published 0.3-0.6 for temperate litter, which
# is a turnover of 1.5-3 years (UNITS.md R11). It was 6.0 -- a two-month turnover, a 10x error with
# no time-scale excuse, carried since shot G4b converted the per-update 0.015 without checking it
# against anything. Shot G5 fixed it because the nutrient tier made it matter: with decay feeding
# three pools that have one small input, a litter layer that vanished in two months short-circuited
# the whole cycle (TUNING.md, shot G5).
decay_k = 0.45
decay_temp_full = 30.0
initial_moisture = 128.0
initial_fertility = 128.0
# Rain at column x is rain × (1 + rain_gradient × (2x/(width − 1) − 1)), clamped at 0: dry west, wet east.
rain_gradient = 0.6

# Update cadences, in ticks (shot G4b). Every rate is per hour or per year and is charged over
# cadence × tick_hours, so doubling a cadence leaves an annual total alone (DECISIONS.md, "Units
# calibration"). tree.update_every, world.compact_every and the two animal immigration_interval keys
# were already parameters and stay in their own sections; tree.seed_every and
# tree.immigration_interval became rates per year in shots G4c and G4e, so they are no longer
# cadences.
[schedule]
cover_every = 10
soil_every = 10
temperature_every = 100
fire_every = 10

[rain]
# Storms (shot G4, recalibrated in G4b). annual_mm of rain falls a year in storms of mean depth
# storm_mean_mm: each tick a storm starts with probability annual_mm/(year_len × storm_mean_mm) ×
# the season's rain factor (climate.rain_base − rain_amp·sin(2πt/year_len), over rain_base, mean 1
# over a year), and its whole depth is drawn exponentially and falls in that tick.
# climate.rain_gradient scales the depth by column. annual_mm 0 leaves the rain out, keeping the
# draw. 800 mm is Lansing's annual normal and 6 mm its ~130 rain days' mean depth (UNITS.md R1, R2).
annual_mm = 800.0
storm_mean_mm = 6.0

[hydro]
# Surface water and soil water (shot G4). false leaves the whole water tier out: the pre-G4
# moisture update runs instead, no water field is allocated, no water file is written and the
# storm draw never happens, so a run is byte-identical to the pre-G4 one apart from the six
# always-zero water columns of series.csv.
enabled = true
# Ponded water evaporates at evap_mm_h, soil water evaporates and transpires at et_mm_h, both
# per hour, scaled by the temperature factor (climate.evap_base + T/evap_div, normalised to 1 at
# climate.temp_base) and, for ET, by 0.2 + 0.8 × the patch's grass and shrub cover. 0.08 mm/h is
# 701 mm a year of open-water evaporation and 0.05 mm/h is 438 mm a year of ET at full cover, both
# inside their published ranges (shot G4b; UNITS.md R4, R5).
evap_mm_h = 0.08
et_mm_h = 0.05
# Soil water of every column at tick 0, as a fraction of its available water capacity.
initial_fill = 0.5
# The most a column's soil holds, as a multiple of field capacity. Water between field capacity
# and this is the part that drains away, so 1.0 would mean no drainage and no leaching.
saturation = 1.2
# Leaching: a soil update that drains `d` mm out of the bottom of a column takes
# min(1, leach_k × d) of its fertility with it. 0 turns leaching off and fertility has no sink.
# leach_k is a fraction per millimetre drained (shot G4b): the mobile share of the nutrient pool
# divided by the rooting zone's water capacity. At the site's ~320 mm of annual drainage 0.0008
# leaches 26% of a column's fertility a year, which is the published range for nitrate loss from a
# humid temperate soil; 0.0002 was set against the pre-G4b rain of 4000 mm a year (UNITS.md R13).
leach_k = 0.0008
# Waterlogging (shot G5). A column whose soil water is at or above waterlog_frac of field capacity
# for waterlog_ticks ticks in a row is waterlogged: growth there is multiplied by each species'
# waterlog_tolerance, and a tree on one may drown (tree.waterlog_mortality). 0.95 of field capacity
# is a store 10% above field capacity: every pore the soil can drain is full and more than half of
# the drainable space above it is too (hydro.saturation caps a column at 1.2). 400 ticks is 100 days
# at year_len 4000, long enough that a wet fortnight does not count and a badly drained corner does.
waterlog_frac = 1.10
waterlog_ticks = 400

[npk]
# Soil nitrogen, phosphorus and potassium (shot G5). false leaves the whole nutrient tier out: the
# pre-G5 0-255 fertility index runs instead, no pool is allocated, npk.bin is not written and
# nothing waterlogs, so a run is byte-identical to the pre-G5 one apart from the six always-zero
# nutrient columns of series.csv.
enabled = true
# Grams per square metre per unit of climate.initial_fertility, at tick 0 (128 units of it here).
# init_n is plant-available mineral nitrogen only -- 1.54 g/m², 15 kg/ha, which is what a temperate
# soil carries as nitrate and ammonium at any moment against an organic stock ~100x larger.
# init_detritus is that organic stock's near end: the litter layer, 55 g/m² of nitrogen, 4 of
# phosphorus and 35 of potassium. The mineral pool is a few weeks of supply and the litter is the
# bank behind it, so a site that started with bare ground would strip the mineral pool building a
# litter layer it cannot finish inside five years (TUNING.md, shot G5).
# init_p is the whole phosphorus pool, 51.2 g/m², of which p_avail_frac is in reach; init_k is
# exchangeable potassium, 38.4 g/m² (UNITS.md R14).
init_n = 0.012
init_p = 0.4
init_k = 0.3
init_detritus = [55.0, 4.0, 35.0]
p_avail_frac = 0.1
# Growth's nutrient factor is min over the three of a / (a + half_sat × need), so half_sat × need
# is the available pool at which that one nutrient halves growth: 0.7 g/m² of nitrogen, 0.5 g/m² of
# available phosphorus and 2.0 g/m² of potassium against grass's needs. Nitrogen is the one meant to
# bind on this site; the other two are set well below their starting pools so that they bind only
# where water has moved them away.
half_sat = [0.28, 2.5, 1.0]
# New nitrogen, g/m² a year, on every plantable column: 25 kg/ha. That is the top of the published
# deposition range for a temperate site near a city, and it is carrying biological fixation too --
# the clover in a lawn is worth as much again (UNITS.md R15). It is the only input any of the three
# pools has: there is no fertiliser in this model, which is why potassium can only ever decline.
# `sweeps/shotG5/FINDINGS.md` is what the site does at 0, 0.5, 1, 2.5 and 5.
n_deposition = 2.5
# Potassium leaches at this multiple of the nitrogen rate. Most of it is held on the clay and
# organic exchange complex rather than dissolved, so it moves an order of magnitude more slowly.
k_leach_ratio = 0.03
# Phosphorus goes with the soil that runoff lifts, so many grams a square metre per millimetre of
# runoff, capped at what is under the cell; dissolved nitrogen goes with the same water, but only
# the n_runoff_frac of a column's pool that sits in the layer surface water mixes with.
p_runoff_g_per_mm = 0.002
n_runoff_frac = 0.1
# The share of a burnt plant's nitrogen that leaves as smoke. What is left of it, and all of its
# phosphorus and potassium, lands on the patch as ash.
fire_n_volatilised = 0.9

# The nine media of the scene contract (docs/SCENE-CONTRACT.md), one table each (shot G4).
# infiltration_mm_h is how fast water soaks in, field_capacity_mm how much plant-available water a
# column of this medium holds (the available water capacity of its rooting zone: a store of 0 is the
# wilting point, not dry soil — UNITS.md section 1), percolation_mm_h how fast the excess drains out
# of the bottom, and plantable
# whether anything roots in it (the Rock rule of a bundle column reads it). A noise world is all
# soil, except its water voxels.
[medium.soil]
infiltration_mm_h = 20.0
field_capacity_mm = 150.0
percolation_mm_h = 4.0
plantable = true

[medium.lawn]
infiltration_mm_h = 15.0
field_capacity_mm = 150.0
percolation_mm_h = 3.0
plantable = true

[medium.bed]
infiltration_mm_h = 30.0
field_capacity_mm = 200.0
percolation_mm_h = 6.0
plantable = true

[medium.mulch]
infiltration_mm_h = 40.0
field_capacity_mm = 200.0
percolation_mm_h = 8.0
plantable = true

[medium.gravel]
infiltration_mm_h = 60.0
field_capacity_mm = 50.0
percolation_mm_h = 30.0
plantable = true

[medium.concrete]
infiltration_mm_h = 1.0
field_capacity_mm = 0.0
percolation_mm_h = 0.0
plantable = false

[medium.asphalt]
infiltration_mm_h = 0.5
field_capacity_mm = 0.0
percolation_mm_h = 0.0
plantable = false

[medium.roof]
infiltration_mm_h = 0.0
field_capacity_mm = 0.0
percolation_mm_h = 0.0
plantable = false

# Open water: it neither soaks in nor holds soil water, and a cell of it carries whatever reaches
# it out of the world, as the world's edge does.
[medium.water]
infiltration_mm_h = 0.0
field_capacity_mm = 0.0
percolation_mm_h = 0.0
plantable = false

[season]
# Temperature swing: temp_base ± amplitude over one year (was climate.temp_amp).
amplitude = 15.0

[cover]
# Millimetres of water one unit of new cover costs (shot G4b: was 15 units of the 0–255 moisture
# index, which the water tier then multiplied by the column's own capacity). Standing cover's
# transpiration is hydro.et_mm_h; this is only the cost of growth.
water_per_growth_mm = 8.8
fertility_draw = 20.0
litter_factor = 20.0
fertility_full = 64.0
grass_suppression = 0.5
shrub_spread_threshold = 0.6
shrub_spread_seed = 0.02

[grass]
# r and g are per year (shot G4b: 0.05 and 0.005 per 10-tick update × 400 updates a year). The
# moisture curve is a fraction of the column's available water capacity (was the 0–255 index).
r = 20.0
g = 2.0
initial = 0.10
# Fractions of full sun (shot G4c: the old [100, 200, 255, 256] on the 0-255 light index, divided
# by 255). Grass takes no light below 39% of full sun and is unlimited above 78%.
light = [0.3922, 0.7843, 1.0, 1.0039]
moisture = [0.0784, 0.3137, 1.0, 1.004]
temp = [0.0, 5.0, 30.0, 35.0]

# Grams of each element per unit of cover density per square metre, and how much of its growth a
# waterlogged column leaves it (shot G5). A full sward here is ~170 g/m² of dry matter -- a mown
# lawn, not a hay meadow -- at 1.5% N, 0.12% P and 1.2% K, which is where 2.5, 0.2 and 2.0 come from
# (UNITS.md R16). Grass is the shallow-rooted species and the one that shrugs standing water off
# best.
[grass.npk]
need_n = 2.5
need_p = 0.2
need_k = 2.0
waterlog_tolerance = 0.8

[shrub]
r = 4.0
g = 1.6
initial = 0.02
# Fractions of full sun (shot G4c): the shade-tolerant species, growing from 16% of full sun.
light = [0.1569, 0.3922, 0.7843, 0.9961]
moisture = [0.0588, 0.2353, 1.0, 1.004]
temp = [-5.0, 0.0, 28.0, 33.0]

# Woodier tissue than grass: more of everything per unit of cover, and less happy in standing water.
[shrub.npk]
need_n = 3.3
need_p = 0.27
need_k = 2.7
waterlog_tolerance = 0.7

[tree]
initial_count = 12
# The tree tier's ages are in years and its drought clock in days (shot G4c); update_every stays a
# cadence in ticks, like the [schedule] keys. At year_len = 4000 these are exactly the tick counts
# they replace: 500, 500, 1000 and 6000 ticks. They are also the model's largest known error --
# a tree that matures in three months and dies at 18 is 25-60x too fast against a published 5-8
# years to 3 m and a 60-150 year lifespan (UNITS.md section 7 and R12). The unit is converted here
# and the value deliberately is not: real ages need a 200000-tick reference run, which the runtime
# invariant forbids, so the error now shows in the file instead of hiding in a tick count
# (DECISIONS.md, "Units calibration, part two").
initial_age_years = 0.125
update_every = 50
young_age_years = 0.125
mature_age_years = 0.25
max_age_years = 1.5
lifespan_jitter = 0.2
crowding_mortality = 0.02
# How much of a mature tree's crown other crowns must cover before the roll above is made (shot
# S11). It replaces a count of trunks within Chebyshev 2 -- a 5 m window, on a species whose mature
# crown is 6-12 m across, which is why the Capitol reference run ended at 623 stems a hectare with
# its crowns covering 266% of the site while the mortality term could not see it (sweeps/shotS3).
# 0.55 sits just above the 95th percentile (0.471) of the crown coverage of the Capitol's own 81
# surveyed trees, so the arrangement a real site carries is not condemned by the rule that judges
# what grows on it: exactly one of the 79 planted at tick 0 is at risk. It is a tuning choice and
# not a measurement -- see TUNING.md and sweeps/shotS11/FINDINGS.md, shot S11, for the runs behind
# it, for what the other candidates did, and for why the reference run alone cannot settle it.
crowding_overlap = 0.55
# Transpiration per hour over the trunk column (shot G4b: was 50 units of the 0–255 index every 50
# ticks, which came to 2352 mm a year). 0.0342 mm/h is 300 mm a year, the low end of the published
# range for an open-grown temperate deciduous tree, chosen low because the draw is charged to one
# column while a mature crown covers nine (UNITS.md R8 and finding 3).
transpiration_mm_h = 0.0342
# Fraction of the column's available water capacity below which a tree is in drought (was 30 of 255).
dry_fraction = 0.12
# 45.66 days of continuous drought kills a tree: the same 500 ticks, and the one tree constant the
# units audit found already right (UNITS.md section 4).
dry_death_days = 45.66
# Seeding attempts a mature tree makes a year (shot G4c: was one every 200 ticks, and 4000/200 = 20).
seeds_per_year = 20.0
seed_radius = 6.0
# Germination light need, as a fraction of full sun (shot G4c: was 150 of 255).
sapling_light = 0.5882
min_spacing = 2
death_detritus = 40.0
# The crown a tree has, as fractions of its height (shot S3). Measured, not chosen: the medians over
# the 81 surveyed trees in worlds/capitol/trees.json are 0.3040 and 0.3684 (n = 81, radius/height sd
# 0.126). They describe the crown, which is 6-12 m across on a mature tree and is not the 3x3 column
# footprint the canopy voxels shade -- that mismatch is what this shot measures and publishes rather
# than hides. These are also the two constants ecoview-native has been holding its own copy of.
crown_radius_frac = 0.30
crown_base_frac = 0.37
light = [0.2353, 0.5882, 1.0, 1.0039]
moisture = [0.1176, 0.3922, 1.0, 1.004]
temp = [-3.0, 2.0, 26.0, 31.0]
immigration_floor = 0
# Tree immigration checks a year (shot G4e: was one every 500 ticks, and 4000/500 = 8). The world
# clock, not a tree's age. At immigration_floor = 0 no check ever plants anything, so this is the
# cadence at which the model asks whether the population has fallen too low.
immigrants_per_year = 8.0
# Chance per tree update that a tree standing on a waterlogged column drowns, before its tolerance
# is applied: the roll is waterlog_mortality × (1 − tree.npk.waterlog_tolerance), so at the values
# here a tree on a column that has stood wet for 100 days dies with chance 0.006 per 50-tick
# update, about 0.48 a year. Deaths are logged with cause `waterlog`.
waterlog_mortality = 0.01

# Grams of each element per metre of height growth, and the tree's tolerance of standing water
# (shot G5). A tree is the deepest-rooted species here and the one that suffers most when the
# profile fills up, which is the whole reason the tolerances differ.
[tree.npk]
need_n = 3.0
need_p = 0.25
need_k = 2.4
waterlog_tolerance = 0.4

[bundle]
# A world loaded from a bundle (shot G1, `../docs/SCENE-CONTRACT.md`). These keys are ignored by a
# noise world, and every one of them is written to meta.json on every run, at its defaults or not
# (shot S2, `src/params.rs`). A run that has no `[bundle]` section in its meta.json was written
# before S2 -- `fixtures/s42-mini` is one -- so a reader still needs a fallback for old runs, and
# what the fallback means is "this run predates S2", not "this run is at the defaults".
# Ecology layers under the bundle's lowest ground: a column's surface layer is base_z + round(its
# mean ground height in metres), so base_z sets how much soil sits below the lowest ground.
base_z = 8
# Building shade: the sun is fixed at this altitude above the horizon, due south, so a roof of
# height h metres darkens the h/tan(altitude) columns north of it, to a level falling by tan per
# column. 45 degrees is the old shade_slope of 1.0 exactly, and is Lansing's noon sun near the
# equinox (47 degrees); 0, or 90 and up, turns shade off. A shaded voxel is fully dark, which is
# the fixed sun's own approximation: the diffuse sky light that really falls into a building's
# shadow arrives with the moving sun, backlog row G9 (shot G4c).
sun_altitude_deg = 45.0
# Planting the bundle's trees (shot G3). A scene tree's age is piecewise linear in its height,
# through (0 m, age 0), (tree_mature_height, tree.mature_age_years) and (tree_tall_height,
# tree_tall_age_years), and flat above: 3 m is a mature sim canopy, 20 m a full-grown street tree.
tree_mature_height = 3.0
tree_tall_height = 20.0
tree_tall_age_years = 0.75
# A scene tree standing on an unplantable column moves to the nearest plantable column within this
# many columns (metres); past it, it is dropped.
tree_move_radius = 2.0

[animals]
# The animal tier (shot G0). false leaves grazers and hunters out of the run entirely: none are
# placed, none immigrate, and the animal phase is skipped, so it draws nothing from the RNG.
# true is the default, and the section is written to meta.json either way (shot S2).
enabled = true
# Grams of N, P and K an animal's body holds per unit of energy (shot G5). Every animal is born,
# placed and immigrates empty; a grazer fills up on what it crops and passes the rest straight
# through as dung, so at 100 energy a grazer carries at most 2 g of nitrogen and the rest of a
# day's grazing is back on the patch within the tick. The number is a residence time, not a stock.
npk_content = [0.02, 0.002, 0.015]

[grazer]
start_count = 300
start_energy = 60.0
start_age_max = 1000
energy_cost = 0.10
max_age = 5000
repro_energy = 70.0
repro_cost = 35.0
cooldown = 300
newborn_energy = 30.0
max_grazers_per_patch = 5
corpse_detritus = 15.0
intake_max = 3.0
intake_k = 20.0
grass_per_energy = 0.00003
eat_below = 90.0
eat_min_grass = 0.0
flee_radius = 4.0
search_patches = 2
crowding = 8.0
choice_tolerance = 0.75
immigration_floor = 0
immigration_interval = 500

[hunter]
start_count = 20
start_energy = 60.0
start_age_max = 1000
energy_cost = 0.04
max_age = 8000
repro_energy = 75.0
repro_cost = 40.0
refractory = 2750
newborn_energy = 40.0
corpse_detritus = 25.0
satiation = 85.0
attack_radius = 2.0
kill_prob = 0.3
kill_energy = 40.0
hunt_cost = 0.0
fail_cost = 0.25
handling_ticks = 0
displace_steps = 3
refugium_k = 2.0
seek_radius = 16.0
flee_radius = 4.0
immigration_floor = 0
immigration_interval = 500

[fire]
# Fire disturbance (shot 9). base_rate is ignitions per patch per year (shot G4b: was 0.002 per
# 10-tick fire update, and 0.002 × 400 updates a year is 0.8). 0 switches fire off: no draws, no
# burning. Shot G4b converts fire's units and reports the ignition count; whether a watered garden
# site should burn at all is backlog row G4d, held for a human.
base_rate = 0.8
temp_min = 15.0
temp_full = 30.0
detritus_weight = 0.0002
canopy_weight = 1.0
duration = 3
spread = 0.1
tree_kill = 0.5
detritus_yield = 10.0
ash = 5.0
animal_damage = 2.0

[disease]
# Density-dependent mortality (shot 10). A rate of 0 switches that species' crowding deaths off.
grazer_rate = 0.001
grazer_threshold = 16
hunter_rate = 0.001
hunter_threshold = 4

[heredity]
# Heritable animal traits (shot 11). mutation 0 switches it off: newborns copy their parent, no draws.
mutation = 0.05

[rng]
# Random stream (shot 14). The seed alone makes the terrain; the stream drives everything after it,
# so other values replay the same world with independent dynamics. 0 is the stream every earlier
# run used, and is written to meta.json like every other section (shot S2).
stream = 0
