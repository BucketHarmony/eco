# ecosim parameters. Starting values from docs/SAD-addendum.md; every change is logged in TUNING.md.
# Curves are [min, low-opt, high-opt, max]: 0 at/below min and at/above max, 1 between the opts.

[world]
height_min = 8
height_max = 24
water_level = 10
rock_top_height = 21
soil_depth = 3
water_fraction = 0.04
canopy_absorb = 100
compact_every = 100
# World size (shot 15): the reference world is a 256×64×32 west–east strip of 32×8 patches.
# A file without these keys means 64×64×32, patch 8. Width and depth are multiples of patch, ≤ 256.
width = 256
depth = 64
height = 32
patch = 8
# Terrain tilt: heights gain slope_bias × (1 − 2x/(width − 1)) before clamping (higher, drier west).
slope_bias = 4.0

[climate]
year_len = 4000
temp_base = 12.0
canopy_cool = 3.0
rain_base = 8.0
rain_amp = 4.0
evap_base = 2.0
evap_div = 8.0
pond_moisture = 255.0
diffusion = 0.10
decay_k = 0.015
decay_temp_full = 30.0
initial_moisture = 128.0
initial_fertility = 128.0
# Rain at column x is rain × (1 + rain_gradient × (2x/(width − 1) − 1)), clamped at 0: dry west, wet east.
rain_gradient = 0.6

[rain]
# Storms (shot G4). Each tick a storm starts with probability storm_p × the season's rain factor
# (climate.rain_base − rain_amp·sin(2πt/year_len), over rain_base), and its depth is drawn
# exponentially with mean storm_mean_mm and falls in that tick. climate.rain_gradient scales the
# depth by column as it scaled the old rain. storm_p 0 leaves the rain out but keeps the draw.
storm_p = 0.10
storm_mean_mm = 10.0

[hydro]
# Surface water and soil water (shot G4). false leaves the whole water tier out: the pre-G4
# moisture update runs instead, no water field is allocated, no water file is written and the
# storm draw never happens, so a run is byte-identical to the pre-G4 one apart from the six
# always-zero water columns of series.csv.
enabled = true
# Ponded water evaporates at evap_mm_h, soil water evaporates and transpires at et_mm_h, both
# per hour, scaled by the temperature factor (climate.evap_base + T/evap_div, normalised to 1 at
# climate.temp_base) and, for ET, by 0.2 + 0.8 × the patch's grass and shrub cover.
evap_mm_h = 0.05
et_mm_h = 0.12
# Soil water of every column at tick 0, as a fraction of its field capacity.
initial_fill = 0.5
# The most a column's soil holds, as a multiple of field capacity. Water between field capacity
# and this is the part that drains away, so 1.0 would mean no drainage and no leaching.
saturation = 1.2
# Leaching: a soil update that drains `d` mm out of the bottom of a column takes
# min(1, leach_k × d) of its fertility with it. 0 turns leaching off and fertility has no sink.
leach_k = 0.0002

# The nine media of the scene contract (docs/SCENE-CONTRACT.md), one table each (shot G4).
# infiltration_mm_h is how fast water soaks in, field_capacity_mm how much soil water a column of
# this medium holds, percolation_mm_h how fast the excess drains out of the bottom, and plantable
# whether anything roots in it (the Rock rule of a bundle column reads it). A noise world is all
# soil, except its water voxels.
[medium.soil]
infiltration_mm_h = 20.0
field_capacity_mm = 150.0
percolation_mm_h = 4.0
plantable = true

[medium.lawn]
infiltration_mm_h = 15.0
field_capacity_mm = 150.0
percolation_mm_h = 3.0
plantable = true

[medium.bed]
infiltration_mm_h = 30.0
field_capacity_mm = 200.0
percolation_mm_h = 6.0
plantable = true

[medium.mulch]
infiltration_mm_h = 40.0
field_capacity_mm = 200.0
percolation_mm_h = 8.0
plantable = true

[medium.gravel]
infiltration_mm_h = 60.0
field_capacity_mm = 50.0
percolation_mm_h = 30.0
plantable = true

[medium.concrete]
infiltration_mm_h = 1.0
field_capacity_mm = 0.0
percolation_mm_h = 0.0
plantable = false

[medium.asphalt]
infiltration_mm_h = 0.5
field_capacity_mm = 0.0
percolation_mm_h = 0.0
plantable = false

[medium.roof]
infiltration_mm_h = 0.0
field_capacity_mm = 0.0
percolation_mm_h = 0.0
plantable = false

# Open water: it neither soaks in nor holds soil water, and a cell of it carries whatever reaches
# it out of the world, as the world's edge does.
[medium.water]
infiltration_mm_h = 0.0
field_capacity_mm = 0.0
percolation_mm_h = 0.0
plantable = false

[season]
# Temperature swing: temp_base ± amplitude over one year (was climate.temp_amp).
amplitude = 15.0

[cover]
moisture_draw = 15.0
fertility_draw = 20.0
litter_factor = 20.0
fertility_full = 64.0
grass_suppression = 0.5
shrub_spread_threshold = 0.6
shrub_spread_seed = 0.02

[grass]
r = 0.05
g = 0.005
initial = 0.10
light = [100.0, 200.0, 255.0, 256.0]
moisture = [20.0, 80.0, 255.0, 256.0]
temp = [0.0, 5.0, 30.0, 35.0]

[shrub]
r = 0.01
g = 0.004
initial = 0.02
light = [40.0, 100.0, 200.0, 254.0]
moisture = [15.0, 60.0, 255.0, 256.0]
temp = [-5.0, 0.0, 28.0, 33.0]

[tree]
initial_count = 12
initial_age = 500
update_every = 50
young_age = 500
mature_age = 1000
max_age = 6000
lifespan_jitter = 0.2
crowding_mortality = 0.02
moisture_draw = 50.0
dry_moisture = 30.0
dry_death_ticks = 500
seed_every = 200
seed_radius = 6.0
sapling_light = 150.0
min_spacing = 2
death_detritus = 40.0
light = [60.0, 150.0, 255.0, 256.0]
moisture = [30.0, 100.0, 255.0, 256.0]
temp = [-3.0, 2.0, 26.0, 31.0]
immigration_floor = 0
immigration_interval = 500

[bundle]
# A world loaded from a bundle (shot G1, `../docs/SCENE-CONTRACT.md`). These keys are ignored by a
# noise world, and are not written to meta.json at their defaults.
# Ecology layers under the bundle's lowest ground: a column's surface layer is base_z + round(its
# mean ground height in metres), so base_z sets how much soil sits below the lowest ground.
base_z = 8
# Building shade: a roof of height h metres darkens the h × shade_slope columns north of it, to a
# level falling by 1 m per 1/shade_slope columns. 1.0 is a 45° sun due south; 0 turns shade off.
shade_slope = 1.0
# Planting the bundle's trees (shot G3). A scene tree's age is piecewise linear in its height,
# through (0 m, age 0), (tree_mature_height, tree.mature_age) and (tree_tall_height, tree_tall_age),
# and flat above: 3 m is a mature sim canopy, 20 m a full-grown street tree.
tree_mature_height = 3.0
tree_tall_height = 20.0
tree_tall_age = 3000
# A scene tree standing on an unplantable column moves to the nearest plantable column within this
# many columns (metres); past it, it is dropped.
tree_move_radius = 2.0

[animals]
# The animal tier (shot G0). false leaves grazers and hunters out of the run entirely: none are
# placed, none immigrate, and the animal phase is skipped, so it draws nothing from the RNG.
# true is the default and is not written to meta.json.
enabled = true

[grazer]
start_count = 300
start_energy = 60.0
start_age_max = 1000
energy_cost = 0.10
max_age = 5000
repro_energy = 70.0
repro_cost = 35.0
cooldown = 300
newborn_energy = 30.0
max_grazers_per_patch = 5
corpse_detritus = 15.0
intake_max = 3.0
intake_k = 20.0
grass_per_energy = 0.00003
eat_below = 90.0
eat_min_grass = 0.0
flee_radius = 4.0
search_patches = 2
crowding = 8.0
choice_tolerance = 0.75
immigration_floor = 0
immigration_interval = 500

[hunter]
start_count = 20
start_energy = 60.0
start_age_max = 1000
energy_cost = 0.04
max_age = 8000
repro_energy = 75.0
repro_cost = 40.0
refractory = 2750
newborn_energy = 40.0
corpse_detritus = 25.0
satiation = 85.0
attack_radius = 2.0
kill_prob = 0.3
kill_energy = 40.0
hunt_cost = 0.0
fail_cost = 0.25
handling_ticks = 0
displace_steps = 3
refugium_k = 2.0
seek_radius = 16.0
flee_radius = 4.0
immigration_floor = 0
immigration_interval = 500

[fire]
# Fire disturbance (shot 9). base_rate 0 switches fire off: no draws, no burning.
base_rate = 0.002
temp_min = 15.0
temp_full = 30.0
detritus_weight = 0.0002
canopy_weight = 1.0
duration = 3
spread = 0.1
tree_kill = 0.5
detritus_yield = 10.0
ash = 5.0
animal_damage = 2.0

[disease]
# Density-dependent mortality (shot 10). A rate of 0 switches that species' crowding deaths off.
grazer_rate = 0.001
grazer_threshold = 16
hunter_rate = 0.001
hunter_threshold = 4

[heredity]
# Heritable animal traits (shot 11). mutation 0 switches it off: newborns copy their parent, no draws.
mutation = 0.05

[rng]
# Random stream (shot 14). The seed alone makes the terrain; the stream drives everything after it,
# so other values replay the same world with independent dynamics. 0 is the stream every earlier
# run used, and is not written to meta.json.
stream = 0
