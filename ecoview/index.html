<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ecoview</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #e8ecf0; }
      body { display: flex; width: 1280px; height: 800px; font: 12px/1.4 system-ui, sans-serif; color: #222; }
      #view { display: block; width: 960px; height: 800px; flex: none; }
      #sidebar { width: 320px; flex: none; box-sizing: border-box; padding: 10px; background: #f7f8f9;
        border-left: 1px solid #cfd4d9; display: flex; flex-direction: column; gap: 8px; }
      h1 { font-size: 15px; margin: 0; }
      label { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      select, button { font: inherit; }
      #slider { width: 100%; margin: 0; }
      .row { display: flex; align-items: center; gap: 8px; }
      #readout { font-variant-numeric: tabular-nums; }
      #chart { width: 300px; height: 220px; border: 1px solid #cfd4d9; background: #fff; }
      #status { color: #555; word-break: break-all; }
      #status.error { color: #b00020; font-weight: 600; }
    </style>
  </head>
  <body>
    <canvas id="view" width="960" height="800"></canvas>
    <aside id="sidebar">
      <h1>ecoview</h1>
      <label>Overlay <select id="overlay"></select></label>
      <label>Camera <select id="cam"></select></label>
      <input id="slider" type="range" min="0" max="0" step="1" value="0" />
      <div class="row"><button id="play" type="button">Play</button><span id="readout">tick –</span></div>
      <canvas id="chart" width="300" height="220"></canvas>
      <div id="status">Loading…</div>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
