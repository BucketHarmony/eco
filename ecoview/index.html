<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ecoview</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #e8ecf0; }
      body { display: flex; width: 1280px; height: 800px; font: 12px/1.4 system-ui, sans-serif; color: #222; }
      #stage { position: relative; width: 960px; height: 800px; flex: none; }
      #view { display: block; width: 960px; height: 800px; }
      /* The crosshair marks the picked cell: the view centre, or the cell ?aim= pins (shot E1). */
      #cross { position: absolute; width: 19px; height: 19px; margin: -10px 0 0 -10px; pointer-events: none;
        background: linear-gradient(#ff2ba6, #ff2ba6) center/19px 1px no-repeat,
          linear-gradient(#ff2ba6, #ff2ba6) center/1px 19px no-repeat; }
      #cross[hidden], #edit[hidden], #overlayrow[hidden], #playrow[hidden], #slider[hidden],
      #hotbar[hidden] { display: none; }
      #hotbar { display: flex; flex-wrap: wrap; gap: 2px 6px; }
      .slot { display: inline-flex; align-items: center; gap: 3px; padding: 1px 3px; border: 1px solid transparent; }
      .slot.on { border-color: #222; background: #fff; font-weight: 600; }
      .slot i { width: 10px; height: 10px; border: 1px solid #8a8f94; }
      #editinfo { white-space: pre-line; font-variant-numeric: tabular-nums; }
      #editinfo.dirty { color: #b00020; }
      #editnote { color: #555; }
      #sidebar { width: 320px; flex: none; box-sizing: border-box; padding: 10px; background: #f7f8f9;
        border-left: 1px solid #cfd4d9; display: flex; flex-direction: column; gap: 8px; }
      h1 { font-size: 15px; margin: 0; }
      label { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      select, button { font: inherit; }
      #slider { width: 100%; margin: 0; }
      .row { display: flex; align-items: center; gap: 8px; }
      #readout { font-variant-numeric: tabular-nums; }
      #chart { width: 300px; height: 500px; border: 1px solid #cfd4d9; background: #fff; }
      #legend { display: flex; flex-wrap: wrap; gap: 2px 8px; }
      #legend[hidden] { display: none; }
      .chip { display: inline-flex; align-items: center; gap: 4px; }
      .chip i { width: 10px; height: 10px; border: 1px solid #8a8f94; }
      #status { color: #555; word-break: break-all; }
      #status.error { color: #b00020; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="view" width="960" height="800"></canvas>
      <div id="cross" hidden></div>
    </div>
    <aside id="sidebar">
      <h1>ecoview</h1>
      <label id="overlayrow">Overlay <select id="overlay"></select></label>
      <label>Camera <select id="cam"></select></label>
      <input id="slider" type="range" min="0" max="0" step="1" value="0" />
      <div class="row" id="playrow"><button id="play" type="button">Play</button><span id="readout">tick –</span></div>
      <div id="edit" hidden>
        <div id="hotbar"></div>
        <div id="editinfo"></div>
        <div id="editnote"></div>
      </div>
      <canvas id="chart" width="300" height="500"></canvas>
      <div id="legend" hidden></div>
      <div id="status">Loading…</div>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
